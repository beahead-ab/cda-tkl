# Activate only after application authentication and the production environment are configured.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
}
server {
    listen 80;
    listen [::]:80;
    server_name cda-tkl.trainmeet.app;
    return 308 https://cda-tkl.trainmeet.app$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cda-tkl.trainmeet.app;
    ssl_certificate /etc/nginx/ssl/cda-tkl.crt;
    ssl_certificate_key /etc/nginx/ssl/charlottendal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 75s;
    location = /anlaggning { return 308 /anlaggning/; }
    location /anlaggning/ { proxy_pass http://127.0.0.1:8911/; }
    location /data/ {
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_vary on;
        proxy_pass http://127.0.0.1:8910;
    }
    location / { proxy_pass http://127.0.0.1:8910; }
}
