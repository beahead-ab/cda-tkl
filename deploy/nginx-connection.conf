# Connection stage: serves the holding page until application deployment.
# Origin certificate and key remain outside the repository, on the server.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
}
server {
    listen 80;
    listen [::]:80;
    server_name cda-tkl.trainmeet.app;
    return 308 https://cda-tkl.trainmeet.app$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cda-tkl.trainmeet.app;
    ssl_certificate /etc/nginx/ssl/cda-tkl.crt;
    ssl_certificate_key /etc/nginx/ssl/charlottendal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /var/www/cda-tkl;
    index index.html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'" always;
    location / { try_files $uri $uri/ =404; }
}
